name: confidential-token-testnet
apiVersion: 3
sources:
  stellar_testnet_events:
    type: dataset
    dataset_name: stellar_testnet.events
    version: 1.2.0
    start_at: 3013364
transforms:
  token_events:
    type: sql
    sql: |
      SELECT
        id,
        contract_id,
        ledger_sequence AS ledger,
        ledger_closed_at,
        transaction_hash AS tx_hash,
        transaction_index,
        CAST(NULL AS INT) AS operation_index,
        topics AS topic,
        data AS `value`
      FROM stellar_testnet_events
      WHERE transaction_successful = TRUE
        AND in_successful_contract_call = TRUE
        AND contract_id = 'CDQLYWKQYQ7QUUU6E5R4YTOZLEUN3OQ62GCS6SCCOLIL7SBT4T2MXPKU'
        AND JSON_VALUE(topics, '$[0].symbol') IN (
          'register',
          'deposit',
          'merge',
          'withdraw',
          'transfer'
        )
    primary_key: id
sinks:
  raw_events:
    type: postgres
    from: token_events
    table: raw_events
    schema: public
    secret_name: INDEXER_POSTGRES_CREDENTIALS
    primary_key: id
